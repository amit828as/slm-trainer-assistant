[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slm-trainer-assistant"
version = "0.1.0"
description = "Evaluation-first tooling for training an expert SLM assistant for SLM fine-tuning workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
slm-trainer = "slm_trainer_assistant.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
